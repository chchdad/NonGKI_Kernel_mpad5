name: Build Xiaomi Pad 5 (nabu) (DerpFest A17)  

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "Xiaomi Pad 5"
  DEVICE_CODENAME : "nabu"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/chchdad/kernel_xiaomi_nabu"
  KERNEL_BRANCH : "derp17"

  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/xiaomi/nabu_inflated_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false
  SUSFS_UPDATE : "false"

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true" 
  KERNELSU_AUTO_FORK : "sukisu" 
 
  
  SUSFS_ENABLE : "false"
  SUSFS_FIXED : ""
 
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : "false"
  NEED_SAFE_DTBO : "false"

  ROM_TEXT : "derpfest_a15"

  PYTHON_VERSION: "2" 

  PACK_METHOD: "Anykernel3" 

  KERNELSU_METHOD: "shell" 

  PATCHES_SOURCE: "author/source" 
  PATCHES_BRANCH: "branch" 

  SUSFS_FOLDER_FIXED: "" 
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "true" 

  HOOK_METHOD: "manual" 
  HOOK_OLDER: "false" 

  KERNEL_PATCH: "false" 

  KPM_ENABLE: "false" 
  KPM_INLINE: "true" 
  KPM_KPATCH_NEXT: "false" 
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" 

  BASEBAND_GUARD_ENABLE: "true" 

  HIDE_STUFF: "false" 

  GENERATE_DTB: "false" 
  GENERATE_CHIP: "qcom" 

  BUILD_DEBUGGER: "true" 
  SKIP_PATCH: "false" 

  BUILD_OTHER_CONFIG: "false" 
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "true" 

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest 
    container: ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      # ================== 终极完美方案：利用 GitHub Release 分发纯净源码 ==================
      - name: 📦 打包并发布纯净源码到 Release (供本地直连下载)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          echo "==== 正在打包纯净内核源码 ===="
          tar -czf pure_kernel_source.tar.gz device_kernel/
          
          echo "==== 正在拉取免安装版 gh 工具 ===="
          wget -qO- https://github.com/cli/cli/releases/download/v2.45.0/gh_2.45.0_linux_amd64.tar.gz | tar -xz -C /tmp
          
          GH_EXEC=$(find /tmp -name "gh" -type f -path "*/bin/*" | head -n 1)
          chmod +x $GH_EXEC
          
          echo "==== 正在将源码推送到仓库的 Releases 页面 ===="
          TAG_NAME="pure-source-$(date +'%Y%m%d-%H%M%S')"
          
          # 🚨 核心修复：强行指定目标仓库，彻底瘫痪它的本地 Git 检测机制
          $GH_EXEC release create "$TAG_NAME" pure_kernel_source.tar.gz \
            --repo ${{ github.repository }} \
            --title "纯净内核源码 (打补丁前) $TAG_NAME" \
            --notes "专为本地 Droidspaces 编译准备。已保留所有 Linux 权限。"
          
          echo "✅ 发布成功！源码已作为 Release 资产永久保存！"
      # ====================================================================================



      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
